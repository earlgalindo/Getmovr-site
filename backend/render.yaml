services:
  - type: web
    name: movr-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DB_PATH
        value: /var/data/data.sqlite
    disk:
      name: movr-data
      mountPath: /var/data
      sizeGB: 1
